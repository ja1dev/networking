{% from "_icons.html" import icon %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · NetLab</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css?v={{ ASSET_VERSION }}">
<script>try { var t = localStorage.getItem("netlab-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="login-wrap">
  <form class="card login stack" method="post" action="/login">
    <div class="brand">{{ icon("logo", 28) }} NetLab</div>
    <p class="muted small" style="text-align:center;margin-top:0">CCNA &amp; CCNP study, made interactive.</p>
    {% if error %}<div class="error-msg" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <div>
      <label class="field" for="username">Username</label>
      <input id="username" type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="off" spellcheck="false" required{% if not username %} autofocus{% endif %}>
    </div>
    <div>
      <label class="field" for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required{% if username %} autofocus{% endif %}>
    </div>
    <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Sign in</button>
  </form>
</div>
</body>
</html>
